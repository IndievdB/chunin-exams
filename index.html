<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hidden Leaf Village</title>
  <meta name="description" content="Choose where in the Hidden Leaf Village to go: ninja training, the Chūnin Exams, missions, the Academy, or Might Guy's hall.">
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/favicon.png" sizes="180x180" type="image/png">
  <link rel="apple-touch-icon" href="assets/favicon.png">
  <link rel="stylesheet" href="css/menu.css">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="ink" aria-hidden="true"></div>

  <header class="ribbon">
    <svg class="leaf" viewBox="0 0 100 100" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round">
        <path d="M50 52 m-4 0 a4 4 0 1 1 8 0 a10 10 0 0 1 -18 0 a16 16 0 0 1 32 0 a22 22 0 0 1 -44 0 a28 28 0 0 1 50 -16"/>
        <path d="M74 32 L88 18 M74 32 L80 52"/>
      </g>
    </svg>
    <span>Hidden Leaf</span>
    <small>木ノ葉隠れの里</small>
  </header>

  <main class="stage">
    <!-- Big animated title: filled by JS from the hovered/selected item -->
    <div class="hero">
      <h1 class="title" aria-live="polite"></h1>
      <p class="blurb"></p>
      <a class="go" href="#"><i aria-hidden="true">火</i>Enter</a>
    </div>

    <!-- Decorative clouds -->
    <img class="cloud c1" src="assets/images/cloud.png" alt="">
    <img class="cloud c2" src="assets/images/cloud.png" alt="">
    <img class="cloud c3" src="assets/images/cloud.png" alt="">

    <!-- Tilted menu -->
    <nav class="menu" aria-label="Village locations">
      <a href="#village"  data-title="Village|Gate"    data-blurb="The great gate, the village map, and the Will of Fire." data-kanji="門">Village Gate</a>
      <a href="#training" data-title="Ninja|Training"  data-blurb="Training Ground 3. The bell test, chakra control, and 500 laps." data-kanji="修">Ninja Training</a>
      <a href="#exams"    data-title="Chūnin|Exams"    data-blurb="The written test, the Forest of Death, and the finals." data-kanji="試">Chūnin Exams</a>
      <a href="#missions" data-title="Missions"        data-blurb="Report to Hokage Tower. Draw a scroll, D-rank to S-rank." data-kanji="任">Missions</a>
      <a href="#academy"  data-title="The|Academy"     data-blurb="Where every shinobi of the Leaf begins." data-kanji="学">Academy</a>
      <a href="#guy"      data-title="Might|Guy"       data-blurb="The Noble Blue Beast. Eight Gates. Springtime of Youth!" data-kanji="力">Might Guy's Hall</a>
    </nav>
  </main>

  <!-- Under-construction overlay: shown in place of the real pages for now -->
  <section class="uc" id="uc" hidden aria-labelledby="uc-title">
    <div class="uc-card">
      <img src="assets/images/under-construction.jpg" alt="A Leaf jōnin standing guard with eyes closed, arms folded.">
      <div class="uc-text">
        <p class="kicker">工事中</p>
        <h2 id="uc-title"><span class="uc-where">Village Gate</span></h2>
        <p class="uc-tape">Under Construction</p>
        <p class="uc-blurb">Wood Style: Four-Pillar House Jutsu is still in progress. Come back soon.</p>
        <a class="go uc-back" href="#"><i aria-hidden="true">火</i>Back to the village</a>
      </div>
    </div>
  </section>

  <!-- Music player -->
  <footer class="player" aria-label="Music player">
    <svg class="player-rod" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#c62828" stroke="#1a0c04" stroke-width="3"/></svg>
    <div class="now">
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="track-name">—</span>
      <span class="track-meta">placeholder loop · royalty-free</span>
    </div>
    <div class="controls">
      <button id="prev" title="Previous track" aria-label="Previous track">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M19 5 9 12l10 7Z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
      <button id="play" title="Play / pause" aria-label="Play">
        <svg class="ic-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5Z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <svg class="ic-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5v14M17 5v14" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>
      </button>
      <button id="next" title="Next track" aria-label="Next track">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M5 5l10 7-10 7Z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
      <button id="loop" title="Loop current track" aria-label="Loop current track" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19.5 10.5A7.5 7.5 0 0 0 6.3 7.2" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
          <path d="M5.5 3.5v4.5H10" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4.5 13.5a7.5 7.5 0 0 0 13.2 3.3" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
          <path d="M18.5 20.5V16H14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 12m-.6 0a.6.6 0 1 0 1.2 0a1.8 1.8 0 1 1 -3.6 0a3 3 0 1 1 6 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="volume">
      <button id="mute" title="Mute" aria-label="Mute" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <g class="bell"><path d="M11 2.5h2M12 3.5a5 5 0 0 0-5 5v4.2L4.8 16.5h14.4L17 12.7V8.5a5 5 0 0 0-5-5Z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M9.5 18.5a2.5 2.5 0 0 0 5 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></g>
          <g class="waves" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path class="w1" d="M20.5 8.5q1.3 3.5 0 7"/><path class="w2" d="M23 6q2.3 6 0 12"/></g>
          <path class="slash" d="M3 3 21 21" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
        </svg>
      </button>
      <input id="vol" type="range" min="0" max="100" value="70" aria-label="Music volume">
    </div>
    <div class="progress" id="progress" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
      <div class="bar"></div>
    </div>
    <span class="time" id="time">0:00 / 0:00</span>
    <audio id="audio" preload="metadata"></audio>
    <audio id="sfx-hover" src="assets/sfx/hover.wav" preload="auto"></audio>
    <audio id="sfx-select" src="assets/sfx/select.wav" preload="auto"></audio>
  </footer>

  <script src="js/menu.js"></script>
</body>
</html>
