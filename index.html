<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hidden Leaf Village</title>
  <meta name="description" content="Choose where in the Hidden Leaf Village to go: ninja training, the Chūnin Exams, missions, the Academy, or Might Guy's hall.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Permanent+Marker&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/menu.css">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="ink" aria-hidden="true"></div>

  <header class="ribbon">
    <svg class="leaf" viewBox="0 0 100 100" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round">
        <path d="M50 52 m-4 0 a4 4 0 1 1 8 0 a10 10 0 0 1 -18 0 a16 16 0 0 1 32 0 a22 22 0 0 1 -44 0 a28 28 0 0 1 50 -16"/>
        <path d="M74 32 L88 18 M74 32 L80 52"/>
      </g>
    </svg>
    <span>Village Select</span>
    <small>木ノ葉隠れの里</small>
  </header>

  <main class="stage">
    <!-- Big animated title: filled by JS from the hovered/selected item -->
    <div class="hero">
      <button class="arrow up" id="arrow-up" aria-label="Previous location"></button>
      <h1 class="title" aria-live="polite"></h1>
      <p class="blurb"></p>
      <a class="go" href="#">Enter <span aria-hidden="true">➤</span></a>
      <button class="arrow down" id="arrow-down" aria-label="Next location"></button>
    </div>

    <!-- Decorative scrolls -->
    <svg class="scroll-deco s1" viewBox="0 0 220 120" aria-hidden="true"><use href="#scroll"/></svg>
    <svg class="scroll-deco s2" viewBox="0 0 220 120" aria-hidden="true"><use href="#scroll"/></svg>

    <!-- Tilted menu -->
    <nav class="menu" aria-label="Village locations">
      <a href="village.html#village"  data-title="Village|Gate"    data-blurb="The great gate, the village map, and the Will of Fire." data-kanji="門">Village Gate</a>
      <a href="village.html#training" data-title="Ninja|Training"  data-blurb="Training Ground 3. The bell test, chakra control, and 500 laps." data-kanji="修">Ninja Training</a>
      <a href="village.html#exams"    data-title="Chūnin|Exams"    data-blurb="The written test, the Forest of Death, and the finals." data-kanji="試">Chūnin Exams</a>
      <a href="village.html#missions" data-title="Missions"        data-blurb="Report to Hokage Tower. Draw a scroll, D-rank to S-rank." data-kanji="任">Missions</a>
      <a href="village.html#academy"  data-title="The|Academy"     data-blurb="Where every shinobi of the Leaf begins." data-kanji="学">Academy</a>
      <a href="village.html#guy"      data-title="Might|Guy"       data-blurb="The Noble Blue Beast. Eight Gates. Springtime of Youth!" data-kanji="力">Might Guy's Hall</a>
    </nav>
  </main>

  <!-- Music player -->
  <footer class="player" aria-label="Music player">
    <svg class="player-rod" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#c62828" stroke="#1a0c04" stroke-width="3"/></svg>
    <div class="now">
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="track-name">—</span>
      <span class="track-meta">placeholder loop · royalty-free</span>
    </div>
    <div class="controls">
      <button id="prev" title="Previous track" aria-label="Previous track">⏮</button>
      <button id="play" title="Play / pause" aria-label="Play">▶</button>
      <button id="next" title="Next track" aria-label="Next track">⏭</button>
      <button id="loop" title="Loop current track" aria-label="Loop current track" aria-pressed="false">🔁</button>
    </div>
    <div class="progress" id="progress" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
      <div class="bar"></div>
    </div>
    <span class="time" id="time">0:00 / 0:00</span>
    <audio id="audio" preload="metadata"></audio>
  </footer>

  <!-- Scroll artwork: rolled ends with visible spiral, paper with ragged edges, red seal -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#e2a561"/><stop offset=".35" stop-color="#a86a33"/><stop offset=".7" stop-color="#6b3a16"/><stop offset="1" stop-color="#3b1d08"/>
      </linearGradient>
      <linearGradient id="paper" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#c9ad73"/><stop offset=".1" stop-color="#f4e6bf"/><stop offset=".9" stop-color="#f4e6bf"/><stop offset="1" stop-color="#c9ad73"/>
      </linearGradient>
      <symbol id="scroll" viewBox="0 0 220 120">
        <!-- paper with ragged top/bottom edge -->
        <path fill="url(#paper)" stroke="#2a1406" stroke-width="3" stroke-linejoin="round"
          d="M34 22 l10 -4 l8 5 l10 -5 l9 4 l10 -4 l9 5 l10 -4 l9 4 l10 -5 l9 5 l10 -4 l9 4 l10 -5 l9 4 l10 -3 L186 98 l-10 4 l-8 -5 l-10 5 l-9 -4 l-10 4 l-9 -5 l-10 4 l-9 -4 l-10 5 l-9 -5 l-10 4 l-9 -4 l-10 5 l-9 -4 l-10 3 Z"/>
        <!-- faint writing lines -->
        <g stroke="#9c7b45" stroke-width="2" opacity=".55" stroke-linecap="round">
          <path d="M70 44 h80 M70 56 h64 M70 68 h74 M70 80 h50"/>
        </g>
        <!-- red seal -->
        <rect x="140" y="62" width="24" height="24" rx="3" fill="#c62828" stroke="#7a1414" stroke-width="2" transform="rotate(-8 152 74)"/>
        <text x="152" y="80" font-size="13" font-family="Noto Sans JP, sans-serif" font-weight="900" fill="#fff" text-anchor="middle" transform="rotate(-8 152 74)">忍</text>
        <!-- rolled ends -->
        <g>
          <rect x="18" y="14" width="30" height="92" rx="15" fill="url(#wood)" stroke="#2a1406" stroke-width="3"/>
          <ellipse cx="33" cy="22" rx="12" ry="7" fill="#f1dca8" stroke="#2a1406" stroke-width="2.5"/>
          <path d="M33 22 m-7 0 a7 3.5 0 1 1 14 0 a4 2 0 1 1 -8 0" fill="none" stroke="#8a6a3a" stroke-width="1.5"/>
          <rect x="24" y="2" width="18" height="16" rx="4" fill="#c62828" stroke="#2a1406" stroke-width="2.5"/>
          <rect x="24" y="102" width="18" height="16" rx="4" fill="#c62828" stroke="#2a1406" stroke-width="2.5"/>
        </g>
        <g>
          <rect x="172" y="14" width="30" height="92" rx="15" fill="url(#wood)" stroke="#2a1406" stroke-width="3"/>
          <ellipse cx="187" cy="22" rx="12" ry="7" fill="#f1dca8" stroke="#2a1406" stroke-width="2.5"/>
          <path d="M187 22 m-7 0 a7 3.5 0 1 1 14 0 a4 2 0 1 1 -8 0" fill="none" stroke="#8a6a3a" stroke-width="1.5"/>
          <rect x="178" y="2" width="18" height="16" rx="4" fill="#c62828" stroke="#2a1406" stroke-width="2.5"/>
          <rect x="178" y="102" width="18" height="16" rx="4" fill="#c62828" stroke="#2a1406" stroke-width="2.5"/>
        </g>
        <!-- tassel cord -->
        <path d="M187 106 q6 10 2 14 M187 106 q-4 12 -8 12" fill="none" stroke="#c62828" stroke-width="2.5" stroke-linecap="round"/>
      </symbol>
    </defs>
  </svg>

  <script src="js/menu.js"></script>
</body>
</html>
